[package]
name = "consh"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.18.0"
base64 = "0.23.1"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
colog = "1.4.0"
libc = "0.2.186"
log = "0.4.30"
serde = { version = "1.0.229", features = ["derive"] }
subterminal = { version = "0.1.0", path = "../subterminal" }
time = { version = "0.3.54", features = ["serde"] }
